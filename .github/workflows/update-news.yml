name: Update chess news & deploy

on:
  schedule:
    - cron: "0 * * * *" # hourly, on the hour (UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # Opt into the Node 24 action runtime ahead of GitHub's 2026-06-16 switchover
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch latest chess news
        run: node scripts/fetch-news.js

      - name: Commit updated news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "Update chess news ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html style.css app.js _site/
          cp -r data _site/

      # enablement:true self-heals the intermittent "Get Pages site failed"
      # (HTTP 500) error by (re)enabling Pages via the API before deploying.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 15
